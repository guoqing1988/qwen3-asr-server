[project]
name = "qwen3-asr"
version = "1.0.3"
description = "Qwen3-ASR API service with CUDA vLLM and CPU Rust backends"
requires-python = ">=3.10,<3.13"
dependencies = [
  "fastapi==0.136.3",
  "fastapi-offline==1.7.6",
  "uvicorn[standard]==0.40.0",
  "pydantic==2.12.0",
  "python-multipart==0.0.22",
  "funasr==1.3.1",
  "requests==2.32.5",
  "modelscope[framework]==1.34.0",
  "sqlite-vec>=0.1.9,<0.2",
  "soundfile==0.13.1",
  "librosa==0.11.0",
  "av>=17.0.1,<18",
  "textual>=0.79,<1",
  "websockets==16.0",
  "addict==2.4.0",
  "datasets==3.6.0",
  "scipy==1.15.3",
  "wetext==0.1.2",
  "python-dotenv==1.2.1",
  "huggingface_hub==1.33.0",
  "tokenizers>=0.23.1,<0.24",
  "safetensors>=0.8.0",
  "loguru==0.7.2",
  "fireredvad==0.0.2",
  "ninja>=1.11",
  "rich>=13.9,<14",
  "setuptools>=70.0.0,<81",
  "torch==2.13.0 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "torchaudio==2.11.0 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "torchvision==0.28.0 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "nvidia-nccl-cu13==2.29.7 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "transformers @ https://github.com/huggingface/transformers/archive/27166ea03f12c940f23176a904ab1d2ff1a3dcbb.zip",
  "vllm[audio]==0.30.0 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = []

[tool.uv]
package = false

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "platform_system == 'Linux'" },
]
torchaudio = [
  { index = "pytorch-cu130", marker = "platform_system == 'Linux'" },
]
torchvision = [
  { index = "pytorch-cu130", marker = "platform_system == 'Linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
